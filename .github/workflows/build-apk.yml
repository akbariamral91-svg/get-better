
name: Build Flutter APK

on:
  push:
    branches:
      - main
    paths:
      - 'masir_ghabuli/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: masir_ghabuli
        run: flutter pub get

      - name: Build release APK
        working-directory: masir_ghabuli
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: masir-ghabuli-apk
          path: masir_ghabuli/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
